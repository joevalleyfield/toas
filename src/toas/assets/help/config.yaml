summary: "Configuration controls how TOAS behaves; help explains the controls, while /config show reports live state."
overview:
  - "start here:"
  - "  /config                  compact usage and navigation"
  - "  /config --help           exact config-interface usage"
  - "  /config show             inspect effective current values (overview)"
  - "  /config list             alias for /config show"
  - "  /config show --flat      inspect all configuration keys (flat key=value)"
  - "  /config show --sources   inspect values with their provenance (flat)"
  - "  /config show <topic>     inspect a focused key/topic view"
  - "  /config show models --flat  inspect model configuration as flat key/value data"
  - "  /config values <key>     inspect allowed categorical values"
  - "  /config set <key> <value> set a durable session override"
  - "  /config endpoint list|add|set|remove ... manage configured endpoint definitions"
  - "  /config target list|add|set|remove ... manage named model targets"
  - ""
  - "discover configuration concepts with:"
  - "  /help config <topic-or-query>"
  - ""
  - "config classes & durability:"
  - "  - durable overrides: /config set, unset, restore, and load write config_override records"
  - "  - ephemeral secrets: /config secret set updates in-memory process secrets only"
  - "  - /config save writes the effective configuration to disk"
  - ""
  - "precedence stack (highest to lowest):"
  - "  ephemeral_secrets > session_override > config_file > env > defaults"
  - ""
  - "compatibility notes:"
  - "  extraction.yaml_position remains available for legacy extraction flows."
  - "  execution-time intent selection is controlled by extraction.intent_arbitration."
  - ""
  - "prompt guidance constraints (for /prompt --constraint ...):"
  - "  tools-guidance-core"
  - "  tools-guidance-repo-work"
  - "  tools-guidance-first-edit-pass"
  - "  tools-guidance-full"
  - ""
  - "tip: use /config show for the curated overview, or /config show --flat to see all valid keys"
  - "tip: the overview is curated; use /config show --sources for every effective key and its winning source"
topics:
  - id: models
    aliases: [model, endpoint, endpoints]
    summary: "Endpoints provide access, catalogs record model knowledge, targets describe what to run, and selection chooses one target for the session."
    facets:
      plain:
        summary: "An endpoint provides access; a catalog records known or observed model IDs; a target combines an endpoint, requested model, and generation choices; selection is a separate session decision. Catalog presence is not proof of live availability."
        next_actions: ["/endpoints", "/models", "/models live [ENDPOINT] [--details|--raw]", "/model targets", "/config endpoint add local BASE_URL", "/models refresh [ENDPOINT]", "/models refresh local", "/config target add --all-known local", "/model select local-MODEL"]
      config:
        summary: "Follow the explicit path: define an endpoint, observe or refresh its catalog, promote known models into durable targets, then select a target for this session. `live` reads the endpoint without writing; `known` reads local catalog state; `refresh` probes and writes the catalog; target creation is local and non-probing."
        related_keys: [llm.model, llm.endpoints, llm.targets, llm.base_url, llm.api_key_source, llm.api_key_ref, llm.provider, backend.mode]
        next_actions: ["/config show models", "/config show models --flat", "/config show models --sources", "/config endpoint list", "/config endpoint add NAME BASE_URL", "/config endpoint set NAME.default_model MODEL", "/models live [ENDPOINT] [--details|--raw]", "/models known [ENDPOINT] [--details]", "/models refresh [ENDPOINT] [--details|--raw]", "/config target add --all-known ENDPOINT", "/config target add ENDPOINT MODEL", "/config target list", "/model targets", "/model select TARGET"]
  - id: generation
    aliases: [generate, thinking, tokens, retries]
    summary: "Generation settings control thinking, output budgets, retries, and request transport."
    facets:
      plain:
        summary: "Generation turns a request into model output through thinking posture, output budgets, retry behavior, and transport shape."
      config:
        summary: "Adjust generation behavior without changing transcript or tool semantics."
        related_keys: [generation.thinking_mode, generation.thinking_budget_tokens, generation.max_tokens, generation.max_retries, generation.retry_delay_s, generation.transport_mode]
        next_actions: [/config show generation, /config values generation.thinking_mode]
  - id: precedence
    aliases: [sources, provenance]
    summary: "Configuration precedence determines which source supplies each effective value."
    facets:
      config:
        summary: "The effective value comes from the highest-precedence source that provides it; source output identifies that winning source only."
        next_actions: [/config show <topic> --sources]
  - id: extraction
    aliases: [intent, intents, arbitration]
    summary: "Extraction identifies candidate operator, tool, and shell intent before later execution or authorization decisions."
    facets:
      plain:
        summary: "Extraction preserves authored source order and lane boundaries while selecting intent candidates; it does not execute them."
      config:
        summary: "Adjust candidate fallback, lane participation, arbitration, staging, and projection behavior."
        related_keys: [extraction.yaml_position, extraction.loose_command_fallback, extraction.user_shell, extraction.operator_command, extraction.intent_arbitration, extraction.shell_staging, extraction.projection_shape]
        next_actions: [/config show extraction, /config values extraction.intent_arbitration, /config set extraction.intent_arbitration in_order]
  - id: history
    aliases: [projections, durable-state]
    summary: "Durable-state inspection uses distinct projections for branch tips, lineage, topology, transcript reconstruction, and model-visible input."
    facets:
      plain:
        summary: "Choose a history surface by the question you need answered: find branch tips, read a lineage, inspect topology, reconstruct executable context, or audit what reaches generation. These views are read-only and related, but not interchangeable."
        next_actions:
          - "toas heads [--sources ...]  find branch tips and navigation targets"
          - "toas history [limit] [anchor]  read a bounded root-to-head lineage"
          - "toas graph [--projection ...]  inspect history topology"
          - "toas transcript [anchor]  reconstruct transcript-shaped context"
          - "toas llm-input [anchor] [--envelope]  audit model-visible input"
  - id: capabilities
    aliases: [capability, tools]
    summary: "Callable capabilities have separate identity, configuration, runtime visibility, argument shape, and operating policy."
    facets:
      plain:
        summary: "The registry describes what a capability is; the configured profile and hidden-tool settings affect whether it is advertised now; capability_help supplies the callable shape; and prompt policy describes how to use it safely. Configured does not by itself mean currently callable."
        next_actions:
          - "capability_help(topic: \"core\")  inspect the current model-facing capability group"
          - "capability_help(topic: \"capture_task_thread\")  inspect one callable shape"
          - "capture_task_thread requires arguments.title and arguments.kind"
          - "capture_task_thread optional arguments include evidence, blocks_progress, active_task_id, scope_hint, and capture_id"
          - "capture_task_thread is a side-thread fork: keep the payload concise and return to the primary task"
          - "/config show capability_advertisement  inspect profile and hidden-tool settings"
          - "/help tools  inspect the broader callable tool reference"
  - id: runtime
    aliases: [async, worker, process]
    summary: "Runtime controls streaming, thinking stream, prompt progress, and asynchronous execution."
    facets:
      plain:
        summary: "Runtime settings shape live execution, streaming deltas, prompt progress feedback, and async execution mechanics."
      config:
        summary: "Adjust streaming, thinking streaming, prompt progress, and execution lifecycle behavior."
        related_keys: [runtime.streaming_mode, runtime.thinking_stream_mode, runtime.prompt_progress_mode, runtime.async_runs, runtime.async_backend_mode, runtime.cancellation_mode, runtime.context_budget_mode]
        next_actions: [/config show runtime, /config set runtime.prompt_progress_mode enabled, /config set runtime.thinking_stream_mode enabled]
  - id: streaming
    aliases: [stream, stream-output, live-output]
    summary: "Streaming delivers incremental output across model generation and tool execution lanes."
    facets:
      plain:
        summary: "Streaming operates across two distinct phases: generation streaming delivers incremental tokens, thinking deltas, and prompt progress from the model; tool execution streaming relays live stdout/stderr from subprocesses before a turn finishes."
        next_actions:
          - "/config show streaming  inspect live streaming-related keys"
          - "/help config runtime    inspect runtime policy toggles"
          - "/help config generation inspect thinking and generation limits"
      config:
        summary: "Configure live answer streaming, thinking deltas, prompt construction progress, and execution timing."
        related_keys: [runtime.streaming_mode, runtime.thinking_stream_mode, runtime.prompt_progress_mode, health_timing.profile, health_timing.first_frame_timeout_ms, health_timing.inter_frame_timeout_ms]
        next_actions:
          - "/config show streaming"
          - "/config set runtime.thinking_stream_mode enabled"
          - "/config set runtime.prompt_progress_mode enabled"
  - id: execution
    aliases: [execute, run, action, actions, subprocess]
    summary: "Execution governs backend invocation, subprocess shell bounds, tool write mutations, and runtime execution lifecycle."
    facets:
      plain:
        summary: "Execution follows model generation and candidate extraction: the runtime invokes backends, enforces assistant shell command timeouts and permissions, materializes tool write mutations, and manages asynchronous execution lifecycles."
        next_actions:
          - "/config show execution        inspect composed execution configuration"
          - "/help config runtime          inspect runtime streaming and progress toggles"
          - "/help tools                   inspect callable tool reference"
      config:
        summary: "Inspect and configure backend execution mode, assistant shell bounds, tool write mechanics, and async execution."
        related_keys:
          - backend.mode
          - backend.managed_local
          - shell.assistant_timeout_s
          - shell.allowed_commands
          - tool_writes.newline_style
          - runtime.async_runs
          - runtime.async_backend_mode
          - runtime.cancellation_mode
        next_actions:
          - "/config show execution"
          - "/config show execution --flat"
          - "/config show execution --sources"
key_descriptions:
  llm.model: "Selects the active model for generation."
  llm.endpoints: "Defines configured endpoint entries and their known models."
  llm.targets: "Defines durable named endpoint/model/generation selections."
  llm.base_url: "Sets the provider-compatible base URL."
  generation.thinking_mode: "Enables or disables backend thinking behavior."
  generation.thinking_budget_tokens: "Limits the token budget available for thinking."
  generation.max_tokens: "Limits generated output tokens."
  generation.max_retries: "Controls retry attempts after a generation failure."
  generation.retry_delay_s: "Controls the delay between generation retries."
  runtime.streaming_mode: "Enables or disables stdout answer streaming."
  runtime.thinking_stream_mode: "Enables or disables live streaming of model thinking deltas."
  runtime.prompt_progress_mode: "Enables or disables live streaming of prompt construction progress."
  runtime.async_runs: "Enables or disables asynchronous execution for step runs."
  runtime.async_backend_mode: "Selects the asynchronous runtime backend."
  runtime.cancellation_mode: "Controls step run cancellation behavior."
  health_timing.first_frame_timeout_ms: "Controls the timeout before the first response frame."
  health_timing.inter_frame_timeout_ms: "Controls the timeout between response frames."
  health_timing.host_request_deadline_ms: "Controls the host request deadline."
  health_timing.recovery_timeout_ms: "Controls recovery timing after a stalled activity."
  shell.assistant_timeout_s: "Limits assistant-directed shell execution time."
  shell.allowed_commands: "Specifies allowed assistant shell commands."
  backend.mode: "Selects the model execution backend mode."
  backend.managed_local: "Configures managed local backend process spawning."
  tool_writes.newline_style: "Controls newline normalization for tool file writes."
