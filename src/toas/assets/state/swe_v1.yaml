name: SWE State Template
description: Standard software engineering state workboard with progress, next steps, artifacts, blockers, and categorized notes.
category: state
protocol:
  handle: toas.state-step/1
  instructions_ref: state/instructions_v1
  tools:
    - read_file
    - replace_block
    - write_file
    - shell
  schema:
    state_patch: object
    tool_calls:
      - tool_name: string
        args: object
    outcome:
      - continue
      - complete
state_template:
  goal: ""
  progress: []
  next_steps: []
  artifacts: []
  blockers: []
  notes:
    constraints: []
    accepted_decisions: []
    pending_proposals: []
    uncertainties: []
