[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toas"
version = "0.1.0"
description = "Transcript-Oriented Agent System"
requires-python = ">=3.10"

dependencies = [
    "openai>=2.30.0",
    "pexpect>=4.9.0",
    "pynvim>=0.6.0",
    "pytest-xdist>=3.8.0",
    "PyYAML>=6.0",
]

[project.scripts]
toas = "toas.cli:main"
toasd = "toas.daemon:main"
toas-llm-harness = "toas.llm_harness:main"
toas-bench = "toas.bench:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toas = ["py.typed", "assets/**/*.yaml", "assets/**/*.txt"]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest-bdd>=8.1.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.3.1",
    "ruff>=0.15.10",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "acceptance: long-horizon acceptance scenarios",
    "S1: acceptance scenario id S1",
    "S2: acceptance scenario id S2",
    "S3: acceptance scenario id S3",
    "S4: acceptance scenario id S4",
    "intake_to_staged_frontier: acceptance scenario slug",
    "staged_frontier_to_first_implementation: acceptance scenario slug",
    "interruption_to_recovered_frontier: acceptance scenario slug",
    "local_first_async_lifecycle: acceptance scenario slug",
    "local_first_async_cancel: acceptance scenario slug",
]
addopts = [
    "-m",
    "not acceptance",
    "--cov=toas",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
    "--cov-max-missing-files=0",
]
timeout = 20

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "C4", "C90", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["toas"]

[tool.ruff.lint.mccabe]
max-complexity = 80

[tool.ruff.lint.pylint]
max-args = 12
max-branches = 120
max-returns = 10
max-statements = 300

[tool.ruff.lint.per-file-ignores]
"src/toas/step.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"src/toas/graph.py" = ["PLR0913"]
"src/toas/llm_harness.py" = ["PLR0913"]
"src/toas/cli_session_commands.py" = ["PLR0913"]
"src/toas/daemon/server_lifecycle.py" = ["PLR0913"]
"src/toas/operator_api.py" = ["PLR0913"]
"src/toas/runtime/operator_commands.py" = ["PLR0913"]
"src/toas/runtime/step_generation_runtime.py" = ["PLR0913"]

