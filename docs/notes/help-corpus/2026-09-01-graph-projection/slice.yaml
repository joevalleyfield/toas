candidate_fields: [disclosure should distinguish selector from projection identity, navigation vocabulary should not imply prompt assets are history nodes]
open_questions: ["Should history selectors use the same name as prompt prefixes?", "Should temporal and consequence be called projections or views?"]
lessons_learned: [The adjacent-family comparison exposes navigation similarity without semantic identity, Graph help names topology more clearly than generic history wording]
light_critique: [The design procedure correctly asks for neighboring navigation, but does not prescribe a vocabulary crosswalk; the crosswalk is useful evidence here]
