candidate_relationships:
  - {from: compaction-projection, to: compaction-handoff-prompt, kind: instructed_by, evidence: [obs-01, obs-04]}
  - {from: compaction-projection, to: session-continuation, kind: enables, evidence: [obs-05, obs-06]}

candidate_fields:
  - behavior must distinguish a preview/dry-run from a durable projection side effect.
  - durability needs to represent source transcript preservation alongside appended projection evidence.
  - disclosure needs a recovery relationship, not only a generic “next topic” link.
  - prompt assets used for transformations should identify whether their output is intended for continuation, inspection, or ordinary conversation.

open_questions:
  - Should /compact help explain the difference between dry-run output and durable compaction evidence?
  - Is “compaction” the right operator term when the durable object is primarily a continuation handoff?
  - Should the projection record expose the selected successor context more directly to inspection commands?

lessons_learned:
  - A prompt can be temporary executable context while its result becomes a durable recovery artifact.
  - “Does not rewrite the source transcript” is a critical behavior claim for help, not an implementation footnote.
  - Recovery and continuation are distinct disclosure intents from ordinary inspection even when they share projection machinery.

light_critique:
  - The design note’s prompt/projection pairing works here, but “projection” hides the user-facing transition; the help model should name the handoff and successor-context behavior.
  - Documentation has the right guardrail but does not surface the prompt ref or record provenance, leaving operators to infer the relationship.
  - The threshold option is visible at the command layer while its effect is mainly on RESULT blocks; this is a likely future explanation gap.
