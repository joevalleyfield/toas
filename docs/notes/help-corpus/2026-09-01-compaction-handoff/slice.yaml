slice:
  id: prompt-compaction-handoff
  source_ids: [handoff-prompt, handoff-command, handoff-side-effect, handoff-record, handoff-doc, handoff-tests]
  collector: codex
  reviewer: self-review; independent review not performed
  review_level: self
  purpose: compare compaction instructions with the executable command and durable handoff projection
  boundary: excludes concept graphs, generic result compaction, backend transport, and full session-rotation design
  collection_state: reviewed
  parent_slice: prompt-concept-graph-projection

observations:
  - {id: obs-01, kind: surface_content, claim: "handoff_v1 instructs the model to produce a concise continuation handoff with summary, files, commands, decisions, and next action; it is not itself the continuation.", evidence: [handoff-prompt]}
  - {id: obs-02, kind: implementation_reference, claim: "/compact accepts dry-run and threshold options and routes a generated handoff through a dedicated compaction handler.", evidence: [handoff-command]}
  - {id: obs-03, kind: behavior_observation, claim: "A valid compaction result is recorded as an assistant projection message and a compaction_projection record; the original session transcript remains unchanged during the side effect.", evidence: [handoff-side-effect, handoff-tests]}
  - {id: obs-04, kind: implementation_reference, claim: "The compaction record retains projection message id, source message ids, source head id when present, prompt ref, and selected status.", evidence: [handoff-record]}
  - {id: obs-05, kind: documentation_claim, claim: "Documentation describes /compact as an executable handoff operation and distinguishes fresh transcript projection from history-backed reprojection.", evidence: [handoff-doc]}
  - {id: obs-06, kind: behavior_observation, claim: "Continuation logic recognizes the compaction prompt/handoff sequence and can include or exclude the preceding graph/tail through explicit options.", evidence: [handoff-tests]}
  - {id: obs-07, kind: design_inference, claim: "Compaction is a state-transition aid rather than merely a text-shortening prompt: its key help needs are trigger, threshold, handoff shape, and continuation effect.", evidence: [obs-01, obs-02, obs-03, obs-06]}

