open_questions: ["Should watch explain offset versus sequence?", "Should cancellation report whether a terminal event was already observed?"]
lessons_learned: [Streaming is a mode of observation, not a different durable item, policy availability belongs in runtime dependencies and constraints]
light_critique: [CLI help lists commands but does not show their run-id handoff or bounded-versus-follow distinction]
