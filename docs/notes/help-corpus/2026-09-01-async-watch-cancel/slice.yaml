slice: {id: async-watch-cancel, source_ids: [async-cli, async-runtime, async-doc, async-probe, async-tests], collector: codex, reviewer: self-review, review_level: self, purpose: compare async run creation, event observation, and cancellation as one lifecycle family, boundary: excludes backend lifecycle and daemon commands, collection_state: reviewed, parent_slice: intents}
observations:
  - {id: obs-01, kind: implementation_reference, claim: "step --async creates a run id, watch consumes event batches with offsets/sequences, and cancel sends a run-id cancellation request.", evidence: [async-cli, async-runtime]}
  - {id: obs-02, kind: behavior_observation, claim: "watch prints delta text, stops on terminal status/event, and can either return a bounded snapshot or follow with polling; policies can disable watch/cancel.", evidence: [async-runtime, async-probe, async-tests]}
  - {id: obs-03, kind: documentation_claim, claim: "The documented async surfaces share lifecycle semantics while backend mode and ownership remain separate concerns.", evidence: [async-doc]}
  - {id: obs-04, kind: design_inference, claim: "Run creation, observation, and cancellation are related lifecycle actions rather than alternate projections of one command.", evidence: [obs-01, obs-02, obs-03]}
